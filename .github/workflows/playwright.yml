name: Playwright Tests in Docker

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble
      env:
        PLAYWRIGHT_BROWSERS_PATH: /ms-playwright

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Debug Docker environment
        run: |
          echo "PLAYWRIGHT_BROWSERS_PATH=$PLAYWRIGHT_BROWSERS_PATH"
          echo "HOME=$HOME"
          echo "Installed Playwright version:"
          npx playwright --version
          echo "Browser directory:"
          ls -la /ms-playwright/
          echo "Chromium directory:"
          ls -la /ms-playwright/chromium_headless_shell-1248/ || true
          echo "WebKit directory:"
          ls -la /ms-playwright/webkit-2370/ || true

      - name: Install dependencies
        run: npm ci

      - name: Run Playwright tests
        run: npx playwright test

      - name: Upload test report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30