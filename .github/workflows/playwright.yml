name: Playwright Tests in Docker

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build and run tests inside Docker container
        run: |
          docker build -t playwright-framework .
          docker run --rm -e PLAYWRIGHT_BROWSERS_PATH=/ms-playwright playwright-framework npx playwright test