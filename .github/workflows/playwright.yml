name: Playwright Tests in Docker

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build --no-cache -t playwright-framework .

      - name: Run tests in Docker container
        run: docker run --rm -e PLAYWRIGHT_BROWSERS_PATH=/ms-playwright playwright-framework